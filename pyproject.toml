[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portreaper"
version = "1.0.0"
description = "Cross-platform interactive Port & Dev Process Sniper TUI/CLI for Windows and Linux"
readme = { text = "PortReaper — Interactive Port & Dev Process Sniper for Windows & Linux.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PortReaper Contributors" }
]
keywords = ["tui", "cli", "ports", "process-manager", "devtools", "textual", "psutil"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "typer>=0.12.0",
]

[project.scripts]
portreaper = "portreaper.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portreaper = ["tui/*.tcss"]
